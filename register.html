<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Chibi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        .register-container {
            max-width: 500px;
            margin: 4rem auto 2rem;
            padding: 2rem;
            background-color: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .register-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-200);
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .register-button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 1rem;
        }

        .register-button:hover {
            background-color: var(--primary-dark);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .status-message {
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .info-box {
            background-color: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: #1565c0;
        }

        .info-box h4 {
            margin: 0 0 0.5rem 0;
            color: #0d47a1;
        }

        .info-box p {
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="register-container">
            <h1 class="register-title">Đăng ký tài khoản</h1>
            
            <!-- Info box -->
            <div class="info-box">
                <h4>📋 Thông tin đăng ký</h4>
                <p>Tài khoản của bạn sẽ được xem xét và phê duyệt trong vòng 24-48 giờ. Bạn sẽ nhận được email thông báo khi tài khoản được duyệt.</p>
            </div>

            <!-- Status message -->
            <div id="statusMessage" class="status-message" style="display: none;"></div>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label for="fullName">Họ và tên *</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu *</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="organization">Tổ chức/Công ty</label>
                    <input type="text" id="organization" name="organization">
                </div>

                <div class="form-group">
                    <label for="userType">Loại tài khoản *</label>
                    <select id="userType" name="userType" required>
                        <option value="">Chọn loại tài khoản</option>
                        <option value="student">Học sinh/Sinh viên</option>
                        <option value="teacher">Giáo viên</option>
                        <option value="parent">Phụ huynh</option>
                        <option value="other">Khác</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason">Lý do đăng ký *</label>
                    <textarea id="reason" name="reason" placeholder="Vui lòng mô tả lý do bạn muốn sử dụng ứng dụng này..." required></textarea>
                </div>

                <button type="submit" class="register-button">Gửi đăng ký</button>
            </form>

            <a href="login.html" class="back-link">Đã có tài khoản? Đăng nhập</a>
            <a href="index.html" class="back-link">Quay lại trang chủ</a>
        </div>
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="register.js"></script>
    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
