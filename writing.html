<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tập viết - Chibi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="writing-container" style="max-width:600px;margin:6rem auto 2rem;padding:2rem;background:var(--white,#fff);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;">
            <h1 style="color:var(--primary-color,#1a237e);margin-bottom:1.5rem;">Tập viết</h1>
            <div class="class-grid">
                <a href="practice-writing.html?class=class1" class="class-card">
                    <h2>Lớp 1</h2>
                    <p>Nền tảng cơ bản cho người mới bắt đầu</p>
                </a>
                <a href="practice-writing.html?class=class2" class="class-card">
                    <h2>Lớp 2</h2>
                    <p>Phát triển kỹ năng giao tiếp</p>
                </a>
                <a href="practice-writing.html?class=class3" class="class-card">
                    <h2>Lớp 3</h2>
                    <p>Nâng cao từ vựng và ngữ pháp</p>
                </a>
                <a href="practice-writing.html?class=class4" class="class-card">
                    <h2>Lớp 4</h2>
                    <p>Luyện tập hội thoại nâng cao</p>
                </a>
                <a href="practice-writing.html?class=class5" class="class-card">
                    <h2>Lớp 5</h2>
                    <p>Kỹ năng đọc hiểu và viết</p>
                </a>
                <a href="practice-writing.html?class=class6" class="class-card">
                    <h2>Lớp 6</h2>
                    <p>Tiếng Nhật thương mại</p>
                </a>
            </div>
        </div>
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
