<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tập viết - Chibi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/practice.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="practice-container">
            <div class="practice-header">
                <div class="practice-navigation">
                    <h2 id="class-title">Lớp 1</h2>
                    <div class="lesson-navigation">
                        <button id="prev-btn" class="nav-btn" disabled>
                            <img src="icon/arrow-left.svg" alt="Trước">
                        </button>
                        <span id="lesson-counter">1/10</span>
                        <button id="next-btn" class="nav-btn">
                            <img src="icon/arrow-right.svg" alt="Sau">
                        </button>
                    </div>
                </div>
                <!-- <h1 id="lesson-title">Tập viết chữ A</h1> -->
                <div class="toolbar">
                    <button id="clear-btn" class="tool-btn">
                        <img src="icon/eraser.svg" alt="Xóa">
                        Xóa tất cả
                    </button>
                    <button id="undo-btn" class="tool-btn">
                        <img src="icon/undo.svg" alt="Hoàn tác">
                        Hoàn tác
                    </button>
                    <div class="pen-size">
                        <label for="pen-width">Độ dày bút:</label>
                        <input type="range" id="pen-width" min="1" max="10" value="2">
                    </div>
                </div>
            </div>
            
            <div class="practice-content">
                <div class="character-display">
                    <img id="character-image" src="">
                    <p id="lesson-description" class="lesson-description"></p>
                </div>
                <div class="drawing-area">
                    <canvas id="drawing-canvas"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
    <script type="module" src="js/drawing.js"></script>
    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
