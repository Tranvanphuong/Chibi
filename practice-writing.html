<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện viết chữ - Chibi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .writing-practice-container {
            max-width: 800px;
            margin: 6rem auto 2rem;
            padding: 2rem;
            background: var(--white, #fff);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .mode-selector button {
            padding: 8px 16px;
            border: 2px solid var(--primary-color, #1a237e);
            border-radius: 4px;
            background-color: white;
            color: var(--primary-color, #1a237e);
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-selector button.active {
            background-color: var(--primary-color, #1a237e);
            color: white;
        }

        /* Layout cho chế độ 1 */
        .mode-1 .canvas-container {
            position: relative;
            width: 100%;
            margin: 20px 0;
            touch-action: none;
        }

        .mode-1 #backgroundImage {
            width: 100%;
            height: auto;
            opacity: 0.3;
            display: block;
        }

        .mode-1 #writingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* Layout cho chế độ 2 */
        .mode-2 .practice-layout {
            display: grid;
            gap: 1rem;
            margin: 20px 0;
        }

        @media (min-width: 768px) {
            .mode-2 .practice-layout {
                grid-template-columns: 300px 1fr;
            }
        }

        @media (max-width: 767px) {
            .mode-2 .practice-layout {
                grid-template-rows: auto 1fr;
            }
        }

        .mode-2 .sample-character {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mode-2 .sample-character img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        .mode-2 .canvas-container {
            position: relative;
            width: 100%;
            touch-action: none;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .mode-2 #writingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
            background: white;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: var(--primary-color, #1a237e);
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .controls button:hover {
            background-color: var(--primary-dark, #0e1642);
        }

        #colorPicker {
            padding: 0;
            width: 40px;
            height: 40px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }

        .stroke-width {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .current-char {
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="writing-practice-container">
            <h1 style="text-align: center; color: var(--primary-color,#1a237e); margin-bottom: 1.5rem;">Luyện viết chữ</h1>
            
            <div class="mode-selector">
                <button id="mode1Btn" class="active">Chế độ 1: Viết chồng</button>
                <button id="mode2Btn">Chế độ 2: Viết theo mẫu</button>
            </div>

            <div class="controls">
                <button id="clearBtn">Xóa tất cả</button>
                <button id="undoBtn">Hoàn tác</button>
                <div class="stroke-width">
                    <label for="strokeWidth">Độ dày:</label>
                    <input type="range" id="strokeWidth" min="1" max="10" value="2">
                </div>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <!-- Container cho chế độ 1 -->
            <div id="mode1Container" class="mode-1">
                <div class="canvas-container">
                    <img id="backgroundImage" src="" alt="Chữ mẫu">
                    <canvas id="writingCanvas"></canvas>
                </div>
            </div>

            <!-- Container cho chế độ 2 -->
            <div id="mode2Container" class="mode-2" style="display: none;">
                <div class="practice-layout">
                    <div class="sample-character">
                        <img id="sampleImage" src="" alt="Chữ mẫu">
                    </div>
                    <div class="canvas-container">
                        <canvas id="writingCanvas2"></canvas>
                    </div>
                </div>
            </div>

            <div class="controls navigation">
                <button id="prevBtn">← Trước</button>
                <span class="current-char">Chữ: <span id="currentCharDisplay">A</span></span>
                <button id="nextBtn">Sau →</button>
            </div>
        </div>
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        // Lấy tham số lớp học từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const classLevel = urlParams.get('class');
        
        // Khởi tạo canvas
        const canvas1 = document.getElementById('writingCanvas');
        const canvas2 = document.getElementById('writingCanvas2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');
        const backgroundImage = document.getElementById('backgroundImage');
        const sampleImage = document.getElementById('sampleImage');
        const container1 = document.querySelector('.mode-1 .canvas-container');
        const container2 = document.querySelector('.mode-2 .canvas-container');
        const currentCharDisplay = document.getElementById('currentCharDisplay');

        // Biến để theo dõi chữ hiện tại
        let currentCharIndex = 0;
        let totalImages = 26; // Số lượng ảnh mặc định, sẽ được cập nhật sau
        let currentMode = 1; // Chế độ mặc định
        let currentCanvas = canvas1;
        let currentCtx = ctx1;

        // Xử lý chuyển đổi chế độ
        const mode1Btn = document.getElementById('mode1Btn');
        const mode2Btn = document.getElementById('mode2Btn');
        const mode1Container = document.getElementById('mode1Container');
        const mode2Container = document.getElementById('mode2Container');

        mode1Btn.addEventListener('click', () => switchMode(1));
        mode2Btn.addEventListener('click', () => switchMode(2));

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 1) {
                mode1Container.style.display = 'block';
                mode2Container.style.display = 'none';
                mode1Btn.classList.add('active');
                mode2Btn.classList.remove('active');
                currentCanvas = canvas1;
                currentCtx = ctx1;
            } else {
                mode1Container.style.display = 'none';
                mode2Container.style.display = 'block';
                mode1Btn.classList.remove('active');
                mode2Btn.classList.add('active');
                currentCanvas = canvas2;
                currentCtx = ctx2;
            }
            resizeCanvas();
            loadCharacter(currentCharIndex);
        }

        // Hàm để load danh sách ảnh
        async function loadCharacterList() {
            try {
                // Thử load ảnh đầu tiên để kiểm tra
                const img = new Image();
                img.src = `images/writing/${classLevel}/1.png`;
                img.onload = () => {
                    // Nếu load được ảnh đầu tiên, tiến hành load ảnh đó
                    loadCharacter(0);
                };
                img.onerror = () => {
                    console.error('Không thể tải ảnh');
                };
            } catch (error) {
                console.error('Lỗi khi tải ảnh:', error);
            }
        }

        // Hàm để load một ảnh cụ thể
        function loadCharacter(index) {
            if (index >= 0) {
                currentCharIndex = index;
                const imageNumber = index + 1;
                const imagePath = `images/writing/${classLevel}/${imageNumber}.png`;
                
                if (currentMode === 1) {
                    backgroundImage.src = imagePath;
                } else {
                    sampleImage.src = imagePath;
                }
                
                currentCharDisplay.textContent = imageNumber;
                
                // Cập nhật trạng thái nút
                document.getElementById('prevBtn').disabled = currentCharIndex === 0;
                document.getElementById('nextBtn').disabled = currentCharIndex === totalImages - 1;
                
                // Xóa canvas để bắt đầu viết chữ mới
                currentCtx.clearRect(0, 0, currentCanvas.width, currentCanvas.height);
                drawingHistory = [];
            }
        }

        // Mảng lưu các nét vẽ để hoàn tác
        let drawingHistory = [];
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Thiết lập kích thước canvas
        function resizeCanvas() {
            if (currentMode === 1) {
                const rect = container1.getBoundingClientRect();
                canvas1.width = rect.width;
                canvas1.height = rect.width * 0.75;
                canvas1.style.width = `${rect.width}px`;
                canvas1.style.height = `${canvas1.height}px`;
                backgroundImage.style.width = `${rect.width}px`;
                backgroundImage.style.height = `${canvas1.height}px`;
            } else {
                const rect = container2.getBoundingClientRect();
                canvas2.width = rect.width;
                canvas2.height = rect.height;
                canvas2.style.width = '100%';
                canvas2.style.height = '100%';
            }

            // Thiết lập lại context sau khi resize
            currentCtx.strokeStyle = document.getElementById('colorPicker').value;
            currentCtx.lineWidth = document.getElementById('strokeWidth').value;
            currentCtx.lineCap = 'round';

            // Vẽ lại các nét vẽ sau khi resize
            redrawCanvas();
        }

        // Xử lý sự kiện vẽ
        function startDrawing(e) {
            isDrawing = true;
            const rect = currentCanvas.getBoundingClientRect();
            if (e.type === 'mousedown') {
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
            } else if (e.type === 'touchstart') {
                e.preventDefault();
                lastX = e.touches[0].clientX - rect.left;
                lastY = e.touches[0].clientY - rect.top;
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = currentCanvas.getBoundingClientRect();
            let x, y;

            if (e.type === 'mousemove') {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            } else if (e.type === 'touchmove') {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            }

            // Đảm bảo tọa độ nằm trong canvas
            x = Math.max(0, Math.min(x, currentCanvas.width));
            y = Math.max(0, Math.min(y, currentCanvas.height));

            currentCtx.beginPath();
            currentCtx.moveTo(lastX, lastY);
            currentCtx.lineTo(x, y);
            currentCtx.strokeStyle = document.getElementById('colorPicker').value;
            currentCtx.lineWidth = document.getElementById('strokeWidth').value;
            currentCtx.lineCap = 'round';
            currentCtx.stroke();

            [lastX, lastY] = [x, y];
        }

        function stopDrawing(e) {
            if (isDrawing) {
                isDrawing = false;
                drawingHistory.push(currentCanvas.toDataURL());
            }
        }

        // Xử lý nút điều khiển
        document.getElementById('clearBtn').addEventListener('click', () => {
            currentCtx.clearRect(0, 0, currentCanvas.width, currentCanvas.height);
            drawingHistory = [];
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (drawingHistory.length > 0) {
                drawingHistory.pop();
                redrawCanvas();
            }
        });

        // Xử lý nút chuyển chữ
        document.getElementById('prevBtn').addEventListener('click', () => {
            loadCharacter(currentCharIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            loadCharacter(currentCharIndex + 1);
        });

        function redrawCanvas() {
            currentCtx.clearRect(0, 0, currentCanvas.width, currentCanvas.height);
            if (drawingHistory.length > 0) {
                const img = new Image();
                img.src = drawingHistory[drawingHistory.length - 1];
                img.onload = () => {
                    currentCtx.drawImage(img, 0, 0);
                };
            }
        }

        // Thiết lập các event listener
        function setupEventListeners() {
            // Mouse events cho canvas 1
            canvas1.addEventListener('mousedown', startDrawing);
            canvas1.addEventListener('mousemove', draw);
            canvas1.addEventListener('mouseup', stopDrawing);
            canvas1.addEventListener('mouseout', stopDrawing);

            // Touch events cho canvas 1
            canvas1.addEventListener('touchstart', startDrawing, { passive: false });
            canvas1.addEventListener('touchmove', draw, { passive: false });
            canvas1.addEventListener('touchend', stopDrawing);
            canvas1.addEventListener('touchcancel', stopDrawing);

            // Mouse events cho canvas 2
            canvas2.addEventListener('mousedown', startDrawing);
            canvas2.addEventListener('mousemove', draw);
            canvas2.addEventListener('mouseup', stopDrawing);
            canvas2.addEventListener('mouseout', stopDrawing);

            // Touch events cho canvas 2
            canvas2.addEventListener('touchstart', startDrawing, { passive: false });
            canvas2.addEventListener('touchmove', draw, { passive: false });
            canvas2.addEventListener('touchend', stopDrawing);
            canvas2.addEventListener('touchcancel', stopDrawing);

            // Ngăn scroll khi vẽ trên mobile
            canvas1.addEventListener('touchstart', function(e) {
                e.preventDefault();
            }, { passive: false });

            canvas2.addEventListener('touchstart', function(e) {
                e.preventDefault();
            }, { passive: false });
        }

        // Khởi tạo canvas khi trang load
        window.addEventListener('load', () => {
            resizeCanvas();
            loadCharacterList();
            setupEventListeners();
        });

        // Resize canvas khi thay đổi kích thước màn hình
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 250);
        });
    </script>
</body>
</html>
