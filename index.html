<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi - Học tiếng Nhật Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main class="main-content">
        <h1 class="main-title" id="class-section">Khóa học tiếng Nhật</h1>
        <div class="main-feature-grid" style="display: flex; gap: 2rem; justify-content: center; margin-bottom: 2.5rem;">
            <a href="learning.html" class="feature-card" style="flex:1; min-width:180px; max-width:260px; background:var(--white,#fff); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:2rem 1rem; text-align:center; text-decoration:none; color:var(--primary-color,#1a237e); font-size:1.2rem; font-weight:500; transition:box-shadow 0.2s;">
                <span style="font-size:2.2rem;">📚</span><br>Học từ vựng
            </a>
            <a href="writing.html" class="feature-card" style="flex:1; min-width:180px; max-width:260px; background:var(--white,#fff); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:2rem 1rem; text-align:center; text-decoration:none; color:var(--primary-color,#1a237e); font-size:1.2rem; font-weight:500; transition:box-shadow 0.2s;">
                <span style="font-size:2.2rem;">✍️</span><br>Tập viết
            </a>
        </div>
        
        
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
