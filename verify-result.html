<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả xác thực đăng ký</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .verify-result-container {
            max-width: 420px;
            margin: 80px auto 40px auto;
            padding: 36px 28px 32px 28px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.10);
            text-align: center;
        }
        .verify-result-container h1 {
            margin-bottom: 18px;
            font-size: 2rem;
            font-weight: 700;
            color: #1976d2;
        }
        .verify-result-container h1.error {
            color: #e53935;
        }
        .verify-result-container p {
            font-size: 1.15rem;
            color: #444;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .verify-result-container .btn {
            display: inline-block;
            margin-top: 0;
            padding: 10px 28px;
            background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
            transition: background 0.2s;
        }
        .verify-result-container .btn:hover {
            background: linear-gradient(90deg, #1565c0 60%, #1976d2 100%);
        }
    </style>
</head>
<body>
    <!-- Include header -->
    <div id="header-placeholder"></div>

    <main>
        <div class="verify-result-container">
            <h1 id="verify-title"></h1>
            <p id="verify-message"></p>
            <a href="index.html" class="btn">Quay về trang chủ</a>
        </div>
    </main>

    <!-- Include footer -->
    <div id="footer-placeholder"></div>

    <script>
        // Load header và footer
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        // Xử lý thông báo xác thực
        const hash = window.location.hash.substring(1); // Bỏ dấu #
        const params = new URLSearchParams(hash);

        const error = params.get('error');
        const errorCode = params.get('error_code');
        const errorDescription = params.get('error_description');

        const title = document.getElementById('verify-title');
        const message = document.getElementById('verify-message');

        if (!error) {
            title.textContent = "Xác thực thành công!";
            title.classList.remove('error');
            message.textContent = "Tài khoản của bạn đã được xác thực. Bạn có thể đăng nhập.";
        } else {
            title.textContent = "Xác thực thất bại!";
            title.classList.add('error');
            if (errorCode === "otp_expired") {
                message.textContent = "Liên kết xác thực đã hết hạn hoặc không hợp lệ. Vui lòng đăng ký lại hoặc yêu cầu gửi lại email xác thực.";
            } else if (errorDescription) {
                message.textContent = decodeURIComponent(errorDescription.replace(/\+/g, ' '));
            } else {
                message.textContent = "Đã xảy ra lỗi khi xác thực tài khoản. Vui lòng thử lại.";
            }
        }
    </script>
</body>
</html>
